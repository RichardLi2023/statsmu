version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Indian/Mauritius }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Indian/Mauritius }
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is a rewrite; stay on 5.x until Next.js supports it (review at each module start).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
