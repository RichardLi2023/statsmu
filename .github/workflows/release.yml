# A release tag (<module>-v<major>.<minor>) deploys to live after approval.
name: release

on:
  push:
    tags: ["*-v*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag is on main
        run: |
          git fetch origin main --depth=200
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit already merged into main."
            exit 1
          fi
      - name: Tag format and changelog entry
        run: python scripts/check_release_tag.py "${GITHUB_REF_NAME}"

  tests:
    needs: [check]
    uses: ./.github/workflows/ci.yml

  deploy-live:
    needs: [tests]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: live
      version: ${{ github.ref_name }}
    secrets: inherit

  github-release:
    needs: [deploy-live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The tag may come from a release published as a pre-release in GitHub's web
      # interface (the web's only way to create a tag). Live is now confirmed, so that
      # release becomes the full, latest release; otherwise the release is created here.
      - name: Publish the GitHub release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v t="## ${tag} " 'index($0,t)==1{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file notes.md --prerelease=false --latest
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag
          fi
