# Runs on every pull request and every push to main. Every module's tests run every time
# (architecture principle 8). The branch rule requires the 'ci-passed' check.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # reused by release.yml so a release reruns every test

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Tests (every module)
        run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history for secrets
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python library vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web library vulnerabilities
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: A planted failing test must fail the test step
        run: python scripts/pipeline_selftest.py

  ci-passed:
    if: always()
    needs: [python, web, security, selftest]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more checks failed: ${{ toJSON(needs) }}"
            exit 1
          fi

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-passed]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      version: unreleased
    secrets: inherit
