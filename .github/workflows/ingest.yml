# Module 1: daily pull. Temporary first version: checks the feed is reachable from GitHub
# and records the test fixtures onto this branch.
name: ingest

on:
  pull_request:
    paths: [".github/workflows/ingest.yml"]

permissions:
  contents: write

jobs:
  reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Reach the Statistics Mauritius SDMX service and record fixtures
        run: |
          set -euo pipefail
          base=https://databrowser.govmu.org/ws/NSI_WS/rest
          dir=modules/01-ingestion/tests/fixtures
          mkdir -p "$dir"
          sj='application/vnd.sdmx.structure+json;version=1.0'
          get() { curl -sS --fail -m 90 -o "$1" -w "%{http_code} %{size_download} bytes %{time_total}s $2\n" -H "Accept: $3" "$base/$2"; }
          get "$dir/df_pop_availability.json" "availableconstraint/MU1,DF_POP,1.0/all/all/all" "$sj"
          get "$dir/df_pop_dataflow.json" "dataflow/MU1/DF_POP/1.0" "$sj"
          get "$dir/df_pop_structure.json" "dataflow/MU1/DF_POP/1.0/?detail=Full&references=Descendants" "$sj"
          get "$dir/df_pop_data.csv" "data/MU1,DF_POP,1.0/all/ALL/?dimensionAtObservation=AllDimensions" 'application/vnd.sdmx.data+csv;version=1.0.0'
          wc -l "$dir/df_pop_data.csv"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir"
          git commit -m 'Module 1: record DF_POP fixtures from the live feed (14 Nov 2026)' || echo 'nothing new'
          git push
