[project]
name = "statsmu"
version = "0.0.0"
description = "Statistics Mauritius data, made easy to read — monorepo"
requires-python = ">=3.12"
dependencies = [
    "sentry-sdk>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["modules"]
norecursedirs = ["_template", "selftest", "web", "node_modules", ".git"]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "modules/_template"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"selftest/**" = ["S"]
